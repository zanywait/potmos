<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060b">
<title>네이버 로그인 · POTMOS</title>
<style>
  html,body{margin:0;height:100%;background:#05060b;color:#f2e6c9;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  .w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center}
  .s{width:34px;height:34px;border-radius:50%;border:3px solid rgba(3,199,90,.25);border-top-color:#03C75A;animation:r .9s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  p{margin:0;font-size:14px} a{color:#9fe3b9;font-size:13px} .b{color:rgba(242,230,201,.55)}
</style>
</head>
<body>
<!-- 라운드 94(1-2): 설치 앱(홈 화면 아이콘)에서 네이버 로그인 중계 페이지.
     앱 화면에서 터치로 바로 네이버 로그인 주소로 가면, 안드로이드가 이 이동을 '네이버 앱 열기'로 가로채 아무 반응이 없을 수 있다.
     터치 없이(이 페이지가 열린 뒤) 이동하면 브라우저 안에서 네이버 로그인 화면이 열린다. -->
<div class="w"><div class="s"></div><p id="t">네이버 로그인으로 이동하고 있어요…</p>
  <a id="m" href="#">이동하지 않으면 여기를 눌러 주세요</a><a class="b" href="./">앱으로 돌아가기</a></div>
<script>
(function(){
  var q = new URLSearchParams(location.search), api = q.get('api') || '', home = location.origin + location.pathname.replace(/[^/]*$/, '');
  var ok = /^https:\/\/[a-z0-9-]+\.supabase\.co\/functions\/v1\/api$/.test(api) || api === 'https://api.potmos.kr/functions/v1/api' || /^http:\/\/localhost:\d+$/.test(api);   // 라운드 104: 사용자 지정 도메인
  if(!ok){ document.getElementById('t').textContent = '잘못된 주소예요 · 앱에서 다시 시도해 주세요'; document.getElementById('m').style.display = 'none'; return; }
  var u = api + '/auth/naver/start?back=' + encodeURIComponent(home) + (q.get('reauth') === '1' ? '&reauth=1' : '');   // 라운드 103: 로그아웃 뒤 첫 로그인
  document.getElementById('m').href = u;
  setTimeout(function(){ location.replace(u); }, 80);
})();
</script>
</body>
</html>
